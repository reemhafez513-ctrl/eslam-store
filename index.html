<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESLAM Store</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 0; text-align: center; }
        header { background: #131921; color: white; padding: 15px; font-size: 24px; font-weight: bold; }
        .hero { background: #232f3e; color: white; padding: 20px; }
        .container { max-width: 800px; margin: 20px auto; padding: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .card { background: white; border-radius: 8px; padding: 15px; width: 250px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; }
        .btn { background: #25D366; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>

    <header>ESLAM Store</header>
    
    <div class="hero">
        <h2>أهلاً بكم في متجر ESLAM للأزياء</h2>
        <p>اختر منتجك واطلبه فوراً عبر الواتساب</p>
    </div>

    <div class="container">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=400" alt="تيشيرت">
            <h3>تيشيرت أوفرايزد</h3>
            <p style="color: green; font-weight: bold;">350 ج.م</p>
            <a class="btn" href="https://wa.me/201000000000?text=أريد%20طلب%20تيشيرت%20أوفرايزد" target="_blank">طلب عبر الواتساب 📱</a>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?w=400" alt="جاكيت">
            <h3>جاكيت جلد اسود</h3>
            <p style="color: green; font-weight: bold;">1100 ج.م</p>
            <a class="btn" href="https://wa.me/201000000000?text=أريد%20طلب%20جاكيت%20جلد" target="_blank">طلب عبر الواتساب 📱</a>
        </div>
    </div>

</body>
</html>
