<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESLAM Store - متجر الملابس</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: #eaeded; color: #0f1111; }

        header { background-color: #131921; color: white; display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; flex-wrap: wrap; }
        .logo { font-size: 26px; font-weight: 800; color: #fff; text-decoration: none; }
        .logo span { color: #ff9900; }

        .cart-icon { background-color: #febd69; color: #111; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        .hero-banner { background: #232f3e; color: white; padding: 30px 20px; text-align: center; }

        .main-container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }

        .product-card { background-color: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; justify-content: space-between; }
        .product-image { width: 100%; height: 220px; object-fit: cover; border-radius: 4px; }
        .product-title { font-size: 16px; font-weight: 700; margin: 10px 0; }
        .price { font-size: 18px; font-weight: 800; color: #B12704; margin-bottom: 10px; }

        .add-to-cart-btn { background-color: #ffd814; border: 1px solid #fcd200; border-radius: 20px; padding: 10px; font-weight: 700; cursor: pointer; width: 100%; }
        .add-to-cart-btn:hover { background-color: #f7ca00; }

        .cart-modal { display: none; position: fixed; top: 0; right: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .cart-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; text-align: center; }
